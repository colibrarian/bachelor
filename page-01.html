<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Вход в хату — Мальчишник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #b7b2a8;
    --glow-orange: #ff7a29;
    --glow-teal: #2ec4c0;
    --ink: #1c1a17;
    --ink-dim: #55504a;
    --glass-fill: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.55);
    --glass-shadow: rgba(30,24,14,0.28);
    --on-glass: #201d19;
    --on-glass-dim: #514c44;
    --green: #1f8a4c;
    --red: #d64420;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 34px 16px 60px;
    position: relative;
    overflow-x: hidden;
    background: var(--concrete);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.35;
    background-image: radial-gradient(circle, rgba(0,0,0,0.10) 0.6px, transparent 0.6px);
    background-size: 4px 4px;
    mix-blend-mode: multiply;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(60px); z-index: 1; opacity: 0.5; }
  .blob.a { width: 300px; height: 300px; background: var(--glow-orange); top: -80px; left: -60px; }
  .blob.b { width: 260px; height: 260px; background: var(--glow-teal); bottom: -60px; right: -50px; opacity: 0.38; }

  .stage { width: 100%; max-width: 460px; position: relative; z-index: 10; }

  .eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--glass-fill);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    box-shadow: 0 6px 16px var(--glass-shadow);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--glow-orange); box-shadow: 0 0 8px var(--glow-orange); }

  .card {
    background: var(--glass-fill);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 30px 24px 32px;
    position: relative;
    box-shadow: 0 20px 40px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 14px; right: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  .hazard-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(28,26,23,0.85);
    color: #f1ede3;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .hazard-chip .bar { width: 14px; height: 8px; background: repeating-linear-gradient(-45deg, #f1ede3 0 2px, var(--glow-orange) 2px 4px); border-radius: 2px; }

  .intro {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--on-glass-dim);
    margin: 0 0 20px;
  }

  .divider { border: none; border-top: 1px solid rgba(28,26,23,0.14); margin: 0 0 20px; }

  h1 {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.0;
    letter-spacing: 0.005em;
    color: var(--on-glass);
    margin: 0 0 4px;
  }

  .question {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 27px;
    line-height: 1.05;
    color: var(--on-glass);
    margin: 0 0 22px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 6px;
  }
  .choice {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 14px;
    padding: 18px 10px;
    color: var(--on-glass);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .choice:hover:not(:disabled) { background: rgba(255,255,255,0.72); }
  .choice:active:not(:disabled) { transform: scale(0.96); }
  .choice:focus-visible { outline: 3px solid var(--glow-orange); outline-offset: 2px; }
  .choice:disabled { cursor: default; opacity: 0.5; }
  .choice.picked { background: rgba(255,122,41,0.22); border-color: var(--glow-orange); opacity: 1; }

  .feedback {
    margin-top: 16px;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--on-glass);
    display: none;
  }
  .feedback.show { display: block; }
  .feedback .verdict { color: var(--glow-orange); }

  .next-btn {
    margin-top: 18px;
    display: none;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    background: linear-gradient(135deg, var(--glow-orange), #e0480f);
    color: #fff3e8;
    border: none;
    padding: 13px 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(226,87,13,0.4);
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.97); }
  .next-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .progress {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="stage">
  <div class="eyebrow-wrap">
    <div class="eyebrow"><span class="dot"></span>СТРАНИЦА 1 · ВХОД В ХАТУ</div>
  </div>

  <div class="card">
    <div class="hazard-chip"><span class="bar"></span>ПРОВЕРКА НА ВХОДЕ</div>

    <h1>Входите в хату</h1>
    <p class="question">а там уже уважаемые люди спрашивают: пики точёные или хуи драчёные?</p>

    <hr class="divider">

    <div class="choices" id="choices">
      <button class="choice" type="button" data-choice="pики">Пики точёные</button>
      <button class="choice" type="button" data-choice="хуи">Хуи драчёные</button>
    </div>

    <p class="feedback" id="feedback"></p>

    <button class="next-btn" id="next-btn">Заходить →</button>
  </div>

</div>

<script>
  const choices = document.querySelectorAll('.choice');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');

  const responses = {
    'pики': 'Любите поострее?',
    'хуи': 'Ага — из тех, кто сразу называет вещи своими именами. Тоже вариант.'
  };
  const verdict = 'Поздняк метаться. Хата уже поняла, что вы за люди.';

  choices.forEach(btn => {
    btn.addEventListener('click', () => {
      choices.forEach(b => { b.disabled = true; });
      btn.classList.add('picked');
      const key = btn.dataset.choice;
      feedback.innerHTML = `${responses[key]}<br><span class="verdict">${verdict}</span>`;
      feedback.classList.add('show');
      nextBtn.classList.add('show');
    });
  });

  nextBtn.addEventListener('click', () => {
    window.location.href = 'page-02.html';
  });
</script>

</body>
</html>
