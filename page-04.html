<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Инструктаж — Мальчишник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Neucha&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #b7b2a8;
    --glow-orange: #ff7a29;
    --glow-teal: #2ec4c0;
    --ink: #1c1a17;
    --ink-dim: #55504a;
    --glass-fill: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.55);
    --glass-shadow: rgba(30,24,14,0.28);
    --on-glass: #201d19;
    --on-glass-dim: #514c44;
    --green: #1f8a4c;
    --red: #d64420;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 34px 16px 60px;
    position: relative;
    overflow-x: hidden;
    background: var(--concrete);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.35;
    background-image: radial-gradient(circle, rgba(0,0,0,0.10) 0.6px, transparent 0.6px);
    background-size: 4px 4px;
    mix-blend-mode: multiply;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(60px); z-index: 1; opacity: 0.5; }
  .blob.a { width: 300px; height: 300px; background: var(--glow-orange); top: -80px; left: -60px; }
  .blob.b { width: 260px; height: 260px; background: var(--glow-teal); bottom: -60px; right: -50px; opacity: 0.38; }

  .stage { width: 100%; max-width: 460px; position: relative; z-index: 10; }

  .eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--glass-fill);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    box-shadow: 0 6px 16px var(--glass-shadow);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--glow-orange); box-shadow: 0 0 8px var(--glow-orange); }

  .card {
    background: var(--glass-fill);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 30px 24px 32px;
    position: relative;
    box-shadow: 0 20px 40px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 14px; right: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  .hazard-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(28,26,23,0.85);
    color: #f1ede3;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .hazard-chip .bar { width: 14px; height: 8px; background: repeating-linear-gradient(-45deg, #f1ede3 0 2px, var(--glow-orange) 2px 4px); border-radius: 2px; }

  .intro {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--on-glass-dim);
    margin: 0 0 20px;
  }

  .divider { border: none; border-top: 1px solid rgba(28,26,23,0.14); margin: 0 0 20px; }

  h1 {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.0;
    letter-spacing: 0.005em;
    color: var(--on-glass);
    margin: 0 0 4px;
  }

  .question {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 27px;
    line-height: 1.05;
    color: var(--on-glass);
    margin: 0 0 22px;
  }

  .aside {
    font-family: 'Neucha', cursive;
    font-size: 17px;
    color: var(--on-glass-dim);
    margin: -14px 0 22px;
    transform: rotate(-0.6deg);
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 6px;
  }
  .choice {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 14px;
    padding: 18px 10px;
    color: var(--on-glass);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .choice:hover:not(:disabled) { background: rgba(255,255,255,0.72); }
  .choice:active:not(:disabled) { transform: scale(0.96); }
  .choice:focus-visible { outline: 3px solid var(--glow-orange); outline-offset: 2px; }
  .choice:disabled { cursor: default; opacity: 0.5; }
  .choice.picked { background: rgba(255,122,41,0.22); border-color: var(--glow-orange); opacity: 1; }
  .choice.correct { background: rgba(31,138,76,0.22); border-color: var(--green); color: var(--green); opacity: 1; }
  .choice.wrong { background: rgba(214,68,32,0.2); border-color: var(--red); color: var(--red); opacity: 1; }

  .tech-card {
    text-align: left;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 16px;
    padding: 16px 16px;
    color: var(--on-glass);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
    width: 100%;
    font-family: 'Inter', sans-serif;
  }
  .tech-card:hover { background: rgba(255,255,255,0.72); }
  .tech-card:active { transform: scale(0.98); }
  .tech-card:focus-visible { outline: 3px solid var(--glow-orange); outline-offset: 2px; }
  .tech-card .tech-title {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--glow-orange);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .tech-card .tech-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--on-glass-dim);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,12,9,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 50px rgba(0,0,0,0.4);
    transform: scale(0.9);
    opacity: 0;
    animation: modal-in 0.3s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes modal-in { to { transform: scale(1); opacity: 1; } }
  .modal p {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.05;
    color: var(--on-glass);
    margin: 0 0 20px;
  }
  .modal button {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    background: linear-gradient(135deg, var(--glow-orange), #e0480f);
    color: #fff3e8;
    border: none;
    padding: 13px 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(226,87,13,0.4);
  }
  .modal button:active { transform: scale(0.97); }
  .modal button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .feedback {
    margin-top: 16px;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--on-glass);
    display: none;
  }
  .feedback.show { display: block; }
  .feedback .verdict { color: var(--glow-orange); }

  .next-btn {
    margin-top: 18px;
    display: none;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    background: linear-gradient(135deg, var(--glow-orange), #e0480f);
    color: #fff3e8;
    border: none;
    padding: 13px 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(226,87,13,0.4);
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.97); }
  .next-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .progress {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="stage">
  <div class="eyebrow-wrap">
    <div class="eyebrow"><span class="dot"></span>СТРАНИЦА 4</div>
  </div>

  <div class="card">
    <div class="hazard-chip"><span class="bar"></span>ИНСТРУКТАЖ</div>

    <h1>Выбери, как</h1>
    <p class="question">заземляться будешь</p>

    <hr class="divider">

    <div class="choices" id="choices">
      <button class="tech-card" type="button" data-choice="локоть">
        <div class="tech-title">С локтя</div>
        <div class="tech-desc">Закидываешь руку за спину или за башку, локоть кверху — и в одного, чисто по-пацански, чтоб пальцы даже не марались. Без лишних соплей и показухи: резкое движение, стопка пуста, хата одобряет.</div>
      </button>
      <button class="tech-card" type="button" data-choice="казачий">
        <div class="tech-title">Казачий</div>
        <div class="tech-desc">Ставишь рюмаху на колено, опускаешься на одно или приседаешь на корты, держишь баланс, чтоб ни капли мимо. Тут главное — не суетиться: головой качнул, опрокинул чётко в топку, а если пролил — считай, перед пацанами зашкварился.</div>
      </button>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <p>Ну, хули смотришь,<br>иди пей.</p>
    <button type="button" id="modal-next">Как выпьешь, жми сюда →</button>
  </div>
</div>

<script>
  const choices = document.querySelectorAll('.tech-card');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalNext = document.getElementById('modal-next');

  choices.forEach(btn => {
    btn.addEventListener('click', () => {
      modalBackdrop.classList.add('show');
    });
  });

  modalNext.addEventListener('click', () => {
    modalBackdrop.classList.remove('show');
    modalNext.textContent = 'Переход...';
    window.location.href = 'page-05.html';
  });
</script>

</body>
</html>
