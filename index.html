<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Раунд имён — Мальчишник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #b7b2a8;
    --glow-orange: #ff7a29;
    --glow-teal: #2ec4c0;
    --ink: #1c1a17;
    --ink-dim: #55504a;
    --glass-fill: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.55);
    --glass-shadow: rgba(30,24,14,0.28);
    --on-glass: #201d19;
    --on-glass-dim: #514c44;
    --green: #1f8a4c;
    --red: #d64420;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 34px 16px 60px;
    position: relative;
    overflow-x: hidden;
    background: var(--concrete);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.35;
    background-image: radial-gradient(circle, rgba(0,0,0,0.10) 0.6px, transparent 0.6px);
    background-size: 4px 4px;
    mix-blend-mode: multiply;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(60px); z-index: 1; opacity: 0.5; }
  .blob.a { width: 300px; height: 300px; background: var(--glow-orange); top: -80px; left: -60px; }
  .blob.b { width: 260px; height: 260px; background: var(--glow-teal); bottom: -60px; right: -50px; opacity: 0.38; }

  .stage { width: 100%; max-width: 460px; position: relative; z-index: 10; }

  .eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--glass-fill);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    box-shadow: 0 6px 16px var(--glass-shadow);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--glow-orange); box-shadow: 0 0 8px var(--glow-orange); }

  .card {
    background: var(--glass-fill);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 30px 24px 32px;
    position: relative;
    box-shadow: 0 20px 40px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 14px; right: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  .hazard-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(28,26,23,0.85);
    color: #f1ede3;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .hazard-chip .bar { width: 14px; height: 8px; background: repeating-linear-gradient(-45deg, #f1ede3 0 2px, var(--glow-orange) 2px 4px); border-radius: 2px; }

  h1 {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 0.98;
    text-transform: uppercase;
    color: var(--on-glass);
    margin: 0 0 8px;
  }

  .subhead { font-size: 13.5px; color: var(--on-glass-dim); margin: 0 0 18px; line-height: 1.6; }

  .divider { border: none; border-top: 1px solid rgba(28,26,23,0.14); margin: 16px 0 18px; }

  .clue { font-size: 14.5px; line-height: 1.75; color: var(--on-glass); margin: 0 0 20px; }
  .clue .lead {
    font-weight: 700; font-size: 10.5px; letter-spacing: 0.14em;
    color: var(--glow-orange); display: block; margin-bottom: 9px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 6px;
  }
  .opt {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    text-align: left;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 12px 12px;
    color: var(--on-glass);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .opt:hover:not(:disabled) { background: rgba(255,255,255,0.72); }
  .opt:active:not(:disabled) { transform: scale(0.97); }
  .opt:focus-visible { outline: 3px solid var(--glow-orange); outline-offset: 2px; }
  .opt:disabled { cursor: default; opacity: 0.55; }
  .opt.correct { background: rgba(31,138,76,0.22); border-color: var(--green); opacity: 1; color: var(--green); }
  .opt.wrong { background: rgba(214,68,32,0.2); border-color: var(--red); opacity: 1; color: var(--red); }

  .feedback {
    margin-top: 14px;
    font-weight: 600;
    font-size: 14.5px;
    min-height: 22px;
  }
  .feedback.wrong-tone { color: var(--red); }
  .feedback.right-tone { color: var(--green); }

  .reveal {
    margin-top: 8px;
    font-family: 'Teko', sans-serif;
    font-size: 26px;
    letter-spacing: 0.01em;
    color: var(--on-glass);
    display: none;
  }
  .reveal.show { display: block; }
  .reveal b { color: var(--glow-orange); }

  .next-btn {
    margin-top: 18px;
    display: none;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    background: linear-gradient(135deg, var(--glow-orange), #e0480f);
    color: #fff3e8;
    border: none;
    padding: 13px 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(226,87,13,0.4);
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.97); }
  .next-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .progress {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 18px;
  }

  .done h1 { font-size: 32px; }
</style>
</head>
<body>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="stage">
  <div class="eyebrow-wrap">
    <div class="eyebrow"><span class="dot"></span><span id="round-label">РАУНД 1 ИЗ 5</span></div>
  </div>

  <div class="card" id="card">
    <div class="hazard-chip"><span class="bar"></span>ПЕРЕКЛИЧКА ЛИЧНОГО СОСТАВА</div>

    <h1 id="title">Выбери прозвище</h1>
    <p class="subhead" id="subhead">Сегодня у каждого — новое имя на весь квест. Дело за малым: угадать, какое из вариантов закрепится.</p>

    <hr class="divider">

    <div class="clue">
      <span class="lead" id="person-label">САША, ЖЕНИХ</span>
      <span id="clue-text"></span>
    </div>

    <div class="options" id="options"></div>

    <p class="feedback" id="feedback"></p>
    <p class="reveal" id="reveal"></p>

    <button class="next-btn" id="next-btn">Дальше</button>
  </div>

  <p class="progress" id="progress-label">ОСТАЛОСЬ ОПОЗНАТЬ: 5</p>
</div>

<script>
  const rounds = [
    {
      person: 'Саша, жених',
      clue: 'Сегодня у виновника торжества появится прозвище на весь квест. Выбери, какой вариант ему подходит больше всего.',
      options: ['Аксель Андер', 'Шурикен', 'Сашка Обдолбашка'],
      correct: 'Аксель Андер',
      right: ['Молодец, мой пиздюк, узнал жениха с одного взгляда.', 'Верно. Хоть тут не подвёл, в отличие от даты выхода из дома.', 'Да! Он самый — виновник торжества и всего, что будет дальше.']
    },
    {
      person: 'Саша Inspire',
      clue: 'Этому Саше — тоже новое имя на сегодня. Выбери, какое закрепится.',
      options: ['Инспирт Неразведенный', 'Уненане I Love You', 'Не выливайте — я допью'],
      correct: 'Инспирт Неразведенный',
      right: ['Молодец, пиздюк, чуйка не подвела.', 'В точку. Градус узнаётся сразу.', 'Да, это он — неразбавленный по жизни.']
    },
    {
      person: 'Дима',
      clue: 'Диме тоже полагается новое имя. Выбери, какое из вариантов ему больше подходит.',
      options: ['Дми Три Два Один', 'Димас Алмаз', 'Дмитрий Эскобаркин'],
      correct: 'Дмитрий Эскобаркин',
      right: ['Молодец, мой пиздюк, распознал контрабандиста.', 'Именно он. У картеля сегодня выходной.', 'Верно, план у него есть даже на этот квест.']
    },
    {
      person: 'Влад',
      clue: 'Владу тоже нужен титул на весь день. Какой из вариантов ему подходит?',
      options: ['Влад Всем Брат', 'Влад Арарат', 'Граф Влад Факула'],
      correct: 'Граф Влад Факула',
      right: ['Молодец, пиздюк, разбудил графа вовремя.', 'Верно, до заката бы точно не признался.', 'Да, это он — ночной житель этого дела.']
    },
    {
      person: 'Костя',
      clue: 'И последний в переписи личного состава — Костя. Выбери его имя на сегодня.',
      options: ['Коста-Рика', 'Костя Кемпбелл', 'Костян Петросян'],
      correct: 'Костя Кемпбелл',
      right: ['Молодец, мой пиздюк, узнал суп в лицо.', 'Точно он, консерва семейной ценности.', 'Да! Кемпбелл собственной персоной.']
    }
  ];

  const wrongLines = [
    'Нихуя, вы бедолаги.',
    'Пиздец, вы читать умеете?',
    'С детьми интереснее играть, чем с вами.',
    'Ёбаный стыд, мимо совсем.',
    'Мозг сегодня явно не приехал.',
    'Даже не близко, соберитесь.'
  ];

  let idx = 0;
  const roundLabel = document.getElementById('round-label');
  const progressLabel = document.getElementById('progress-label');
  const clueText = document.getElementById('clue-text');
  const optionsEl = document.getElementById('options');
  const feedback = document.getElementById('feedback');
  const reveal = document.getElementById('reveal');
  const nextBtn = document.getElementById('next-btn');
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const subhead = document.getElementById('subhead');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderRound() {
    const r = rounds[idx];
    roundLabel.textContent = `РАУНД ${idx + 1} ИЗ ${rounds.length}`;
    progressLabel.textContent = `ОСТАЛОСЬ ГЕРОЕВ: ${rounds.length - idx}`;
    document.getElementById('person-label').textContent = r.person.toUpperCase();
    clueText.textContent = r.clue;
    feedback.textContent = '';
    feedback.className = 'feedback';
    reveal.className = 'reveal';
    reveal.textContent = '';
    nextBtn.className = 'next-btn';

    const opts = shuffle(r.options);

    optionsEl.innerHTML = '';
    opts.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.textContent = name;
      btn.addEventListener('click', () => onAnswer(btn, name, r));
      optionsEl.appendChild(btn);
    });
  }

  function onAnswer(btn, chosen, r) {
    if (chosen === r.correct) {
      const buttons = optionsEl.querySelectorAll('.opt');
      buttons.forEach(b => { b.disabled = true; });
      btn.classList.add('correct');
      feedback.className = 'feedback right-tone';
      feedback.textContent = r.right[Math.floor(Math.random() * r.right.length)];
      reveal.innerHTML = `Верно: <b>${r.correct}</b>`;
      reveal.classList.add('show');
      nextBtn.classList.add('show');
    } else {
      btn.disabled = true;
      btn.classList.add('wrong');
      feedback.className = 'feedback wrong-tone';
      feedback.textContent = wrongLines[Math.floor(Math.random() * wrongLines.length)];
    }
  }

  nextBtn.addEventListener('click', () => {
    idx++;
    if (idx < rounds.length) {
      renderRound();
    } else {
      showDone();
    }
  });

  function showDone() {
    card.classList.add('done');
    roundLabel.textContent = 'ИМЕНА ЗАКРЕПЛЕНЫ';
    progressLabel.textContent = 'СОСТАВ УСТАНОВЛЕН';
    title.textContent = 'Готово';
    subhead.textContent = 'Теперь дело официально начинается — и обратного пути нет.';
    document.querySelector('.clue').style.display = 'none';
    optionsEl.style.display = 'none';
    feedback.textContent = '';
    reveal.className = 'reveal show';
    reveal.innerHTML = 'Аксель Андер · Инспирт Неразведенный · Дмитрий Эскобаркин · Граф Влад Факула · Костя Кемпбелл';
    nextBtn.textContent = 'К первой загадке →';
    nextBtn.classList.add('show');
    nextBtn.onclick = () => { window.location.href = 'page-01.html'; };
  }

  renderRound();
</script>

</body>
</html>
