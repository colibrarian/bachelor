<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Тукумс — Мальчишник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #b7b2a8;
    --glow-orange: #ff7a29;
    --glow-teal: #2ec4c0;
    --ink: #1c1a17;
    --ink-dim: #55504a;
    --glass-fill: rgba(255,255,255,0.34);
    --glass-border: rgba(255,255,255,0.55);
    --glass-shadow: rgba(30,24,14,0.28);
    --on-glass: #201d19;
    --on-glass-dim: #514c44;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 34px 16px;
    position: relative;
    overflow-x: hidden;
    background: var(--concrete);
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); z-index: 1; opacity: 0.5; }
  .blob.a { width: 300px; height: 300px; background: var(--glow-orange); top: -80px; left: -60px; }
  .blob.b { width: 260px; height: 260px; background: var(--glow-teal); bottom: -60px; right: -50px; opacity: 0.38; }
  .card {
    background: var(--glass-fill);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 34px 26px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 10;
    box-shadow: 0 20px 40px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  h1 {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 40px;
    color: var(--on-glass);
    margin: 0 0 10px;
  }
  p { font-size: 14px; color: var(--on-glass-dim); line-height: 1.7; margin: 0; }
</style>
</head>
<body>
<div class="blob a"></div>
<div class="blob b"></div>
<div class="card">
  <h1>Тукумс достигнут</h1>
  <p>Здесь будет следующая загадка. Страница ещё в разработке — заглушка, чтобы цепочка ссылок не обрывалась.</p>
</div>
</body>
</html>
